services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Console
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [lakehouse]

  rustfs-init:
    image: rustfs/rc:latest
    container_name: rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      rc alias set local http://rustfs:9000 \"$$RUSTFS_ACCESS_KEY\" \"$$RUSTFS_SECRET_KEY\" &&
      rc mb -p local/warehouse || true &&
      echo 'bucket warehouse ready'
      "
    networks: [lakehouse]
    restart: "no"

  postgres:
    image: postgres:18-alpine
    container_name: nessie-postgres
    # Not published to host; only reachable on the lakehouse network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nessie-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [lakehouse]

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "127.0.0.1:19120:19120"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      QUARKUS_HTTP_PORT: "19120"
      # Quiet the access log — healthcheck now hits the separate management port.
      QUARKUS_HTTP_ACCESS_LOG_ENABLED: "false"
      QUARKUS_LOG_CATEGORY__ORG_PROJECTNESSIE_SERVER_AUTHN__LEVEL: WARN
      # ---- Production auth (uncomment & point at an OIDC issuer) ----
      # NESSIE_SERVER_AUTHENTICATION_ENABLED: "true"
      # QUARKUS_OIDC_AUTH_SERVER_URL: https://your-issuer/realms/nessie
      # QUARKUS_OIDC_CLIENT_ID: nessie
    healthcheck:
      # Uses Quarkus management port (9000, container-internal) — no API access-log noise.
      test: ["CMD-SHELL", "curl -f http://localhost:9000/q/health/ready || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [lakehouse]

  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      nessie:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    networks: [lakehouse]

volumes:
  rustfs-data:
  nessie-pg-data:

networks:
  lakehouse:
    driver: bridge
